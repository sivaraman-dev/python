<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="gradient-text">Tic Tac Toe</h1>
            <div id="status" class="status-x">Player X's Turn</div>
        </header>

        <main>
            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
            
            <div class="controls">
                <button id="reset-btn">
                    <span>Restart Game</span>
                </button>
            </div>
        </main>
    </div>
    
    <div id="winner-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="winner-text">Player X Wins!</h2>
            <button id="modal-reset-btn">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
