<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #08090c;
    --surface:  #0f1117;
    --card:     #141720;
    --border:   #1f2435;
    --green:    #00ff88;
    --green2:   #00c96a;
    --dim:      #1a3328;
    --yellow:   #ffe156;
    --red:      #ff4d6d;
    --muted:    #4a5168;
    --text:     #dde3f0;
    --mono:     'Space Mono', monospace;
    --display:  'Unbounded', sans-serif;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
  }

  /* Scanline overlay */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  .layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    min-height: 100vh;
  }

  /* ── LEFT PANEL ── */
  .left {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 40px 32px;
    gap: 32px;
  }

  .logo {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .logo-label {
    font-size: 9px;
    letter-spacing: 0.25em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .logo-title {
    font-family: var(--display);
    font-size: 1.6rem;
    font-weight: 900;
    color: var(--green);
    line-height: 1.1;
    text-shadow: 0 0 30px rgba(0,255,136,0.4);
  }

  .logo-sub {
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* Range inputs */
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .form-group label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .range-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .range-input {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--green);
    font-family: var(--mono);
    font-size: 1rem;
    font-weight: 700;
    text-align: center;
    outline: none;
    transition: border-color 0.2s;
    -moz-appearance: textfield;
  }
  .range-input::-webkit-inner-spin-button { display: none; }
  .range-input:focus { border-color: var(--green); }

  .range-sep { color: var(--muted); font-size: 0.8rem; }

  .run-btn {
    width: 100%;
    padding: 14px;
    background: var(--green);
    color: #08090c;
    border: none;
    border-radius: 10px;
    font-family: var(--display);
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .run-btn::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
  }

  .run-btn:hover {
    background: #33ffaa;
    box-shadow: 0 0 30px rgba(0,255,136,0.5);
    transform: translateY(-1px);
  }

  .run-btn:active { transform: translateY(1px); }
  .run-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Stats box */
  .stats {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .stat { display: flex; flex-direction: column; gap: 4px; }

  .stat-val {
    font-family: var(--display);
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--green);
  }

  .stat-label {
    font-size: 9px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* Legend */
  .legend {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: auto;
  }

  .legend-title {
    font-size: 9px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    color: var(--muted);
  }

  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  /* ── RIGHT PANEL ── */
  .right {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .right-top {
    padding: 32px 36px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .section-label {
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .view-toggle {
    display: flex;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
  }

  .vbtn {
    padding: 6px 14px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .vbtn.active {
    background: var(--card);
    color: var(--green);
    border: 1px solid rgba(0,255,136,0.2);
  }

  /* Grid view */
  #view-grid {
    padding: 24px 36px 36px;
    flex: 1;
    overflow-y: auto;
  }

  .num-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
    gap: 8px;
  }

  .num-cell {
    aspect-ratio: 1;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    opacity: 0;
    transform: scale(0.7);
    cursor: default;
    position: relative;
  }

  .num-cell.shown { opacity: 1; transform: scale(1); }

  .num-cell.is-prime {
    background: var(--dim);
    border-color: rgba(0,255,136,0.4);
    color: var(--green);
    box-shadow: 0 0 12px rgba(0,255,136,0.15);
  }

  .num-cell.skipped {
    opacity: 0.25 !important;
  }

  .num-cell:hover { transform: scale(1.08); z-index: 2; }

  /* Log view */
  #view-log {
    padding: 24px 36px 36px;
    flex: 1;
    overflow-y: auto;
    display: none;
  }

  .log-entry {
    display: flex;
    gap: 14px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    font-size: 12px;
    align-items: baseline;
    opacity: 0;
    transform: translateX(-8px);
    transition: all 0.3s ease;
  }

  .log-entry.shown { opacity: 1; transform: translateX(0); }

  .log-num {
    width: 32px;
    text-align: right;
    font-weight: 700;
    flex-shrink: 0;
  }

  .log-action {
    width: 70px;
    flex-shrink: 0;
    padding: 1px 8px;
    border-radius: 4px;
    font-size: 10px;
    text-align: center;
    letter-spacing: 0.06em;
  }

  .log-action.prime  { background: rgba(0,255,136,0.15); color: var(--green); border: 1px solid rgba(0,255,136,0.3); }
  .log-action.break  { background: rgba(255,77,109,0.12); color: var(--red);   border: 1px solid rgba(255,77,109,0.2); }
  .log-action.continue { background: rgba(255,225,86,0.1); color: var(--yellow); border: 1px solid rgba(255,225,86,0.2); }

  .log-reason { color: var(--muted); flex: 1; }

  /* Placeholder */
  .placeholder {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--muted);
    padding: 60px;
    text-align: center;
  }

  .placeholder-icon {
    font-size: 3rem;
    opacity: 0.3;
  }

  .placeholder p { font-size: 13px; line-height: 1.7; }

  /* Status bar */
  .statusbar {
    border-top: 1px solid var(--border);
    padding: 8px 36px;
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 10px;
    color: var(--muted);
    flex-shrink: 0;
    background: var(--surface);
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .status-dot.idle { background: var(--muted); box-shadow: none; animation: none; }
  .status-dot.busy { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* Error toast */
  .toast {
    position: fixed;
    bottom: 24px; right: 24px;
    background: var(--red);
    color: #fff;
    font-family: var(--mono);
    font-size: 12px;
    padding: 12px 20px;
    border-radius: 10px;
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.3s;
    z-index: 999;
  }

  .toast.show { transform: translateY(0); opacity: 1; }

  @media (max-width: 700px) {
    .layout { grid-template-columns: 1fr; }
    .left { border-right: none; border-bottom: 1px solid var(--border); padding: 28px 20px; }
    #view-grid, #view-log { padding: 20px; }
    .right-top { padding: 20px 20px 0; }
    .statusbar { padding: 8px 20px; }
  }
</style>
</head>
<body>

<div class="layout">

  <!-- LEFT PANEL -->
  <aside class="left">
    <div class="logo">
      <span class="logo-label">Homework #1</span>
      <div class="logo-title">PRIME<br>FINDER</div>
      <div class="logo-sub">break · continue · for-else</div>
    </div>

    <div class="form-group">
      <label>Range</label>
      <div class="range-row">
        <input class="range-input" id="inp-start" type="number" value="1" min="1" max="999">
        <span class="range-sep">→</span>
        <input class="range-input" id="inp-end"   type="number" value="100" min="2" max="1000">
      </div>
    </div>

    <button class="run-btn" id="run-btn" onclick="runPrimes()">▶ FIND PRIMES</button>

    <div class="stats">
      <div class="stat">
        <span class="stat-val" id="stat-count">—</span>
        <span class="stat-label">Primes found</span>
      </div>
      <div class="stat">
        <span class="stat-val" id="stat-range">—</span>
        <span class="stat-label">Range size</span>
      </div>
      <div class="stat">
        <span class="stat-val" id="stat-breaks">—</span>
        <span class="stat-label">breaks hit</span>
      </div>
      <div class="stat">
        <span class="stat-val" id="stat-skips">—</span>
        <span class="stat-label">continues</span>
      </div>
    </div>

    <div class="legend">
      <div class="legend-title">Legend</div>
      <div class="legend-item">
        <div class="legend-dot" style="background:var(--green); box-shadow:0 0 6px rgba(0,255,136,0.4)"></div>
        Prime — for-else confirmed
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:var(--red); opacity:0.6"></div>
        Composite — break hit
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:var(--yellow); opacity:0.4"></div>
        Even &gt;2 — continue skipped
      </div>
    </div>
  </aside>

  <!-- RIGHT PANEL -->
  <main class="right">
    <div class="right-top">
      <span class="section-label" id="result-label">Awaiting input…</span>
      <div class="view-toggle">
        <button class="vbtn active" id="vbtn-grid" onclick="setView('grid')">Grid</button>
        <button class="vbtn"        id="vbtn-log"  onclick="setView('log')">Step Log</button>
      </div>
    </div>

    <div id="view-grid">
      <div class="placeholder" id="placeholder">
        <div class="placeholder-icon">🔍</div>
        <p>Set a range and click<br><strong style="color:var(--green)">▶ FIND PRIMES</strong><br>to start.</p>
      </div>
      <div class="num-grid" id="num-grid" style="display:none"></div>
    </div>

    <div id="view-log"></div>

    <div class="statusbar">
      <div class="status-dot idle" id="status-dot"></div>
      <span id="status-text">Server: http://localhost:8001</span>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'http://localhost:8001';
let currentView = 'grid';
let lastData = null;

function setView(v) {
  currentView = v;
  document.getElementById('vbtn-grid').className = 'vbtn' + (v==='grid'?' active':'');
  document.getElementById('vbtn-log').className  = 'vbtn' + (v==='log' ?' active':'');
  document.getElementById('view-grid').style.display = v==='grid' ? 'block' : 'none';
  document.getElementById('view-log').style.display  = v==='log'  ? 'block' : 'none';
  if (lastData) v==='grid' ? renderGrid(lastData) : renderLog(lastData);
}

function setStatus(state, text) {
  const dot = document.getElementById('status-dot');
  dot.className = 'status-dot ' + state;
  document.getElementById('status-text').textContent = text;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

async function runPrimes() {
  const start = parseInt(document.getElementById('inp-start').value);
  const end   = parseInt(document.getElementById('inp-end').value);

  if (isNaN(start) || isNaN(end) || start < 1 || end > 1000 || start >= end) {
    showToast('Range must be 1–1000, start < end');
    return;
  }

  const btn = document.getElementById('run-btn');
  btn.disabled = true;
  btn.textContent = '⏳ Running…';
  setStatus('busy', 'Calling Python backend…');

  try {
    const res = await fetch(`${API}/api/primes?start=${start}&end=${end}`);
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error || 'Server error');
    }
    const data = await res.json();
    lastData = data;

    document.getElementById('stat-count').textContent = data.count;
    document.getElementById('stat-range').textContent = end - start + 1;
    document.getElementById('stat-breaks').textContent = data.steps.filter(s => s.action === 'break').length;
    document.getElementById('stat-skips').textContent  = data.steps.filter(s => s.action === 'continue').length;
    document.getElementById('result-label').textContent =
      `${data.count} primes in [${start}, ${end}]`;

    if (currentView === 'grid') renderGrid(data);
    else renderLog(data);

    setStatus('', `Done — ${data.count} primes found`);
  } catch(e) {
    showToast('❌ ' + e.message + ' — is server.py running?');
    setStatus('idle', 'Error — check console');
  } finally {
    btn.disabled = false;
    btn.textContent = '▶ FIND PRIMES';
  }
}

function renderGrid(data) {
  document.getElementById('placeholder').style.display = 'none';
  const grid = document.getElementById('num-grid');
  grid.style.display = 'grid';
  grid.innerHTML = '';

  const primeSet = new Set(data.primes);
  const stepMap  = {};
  data.steps.forEach(s => { stepMap[s.number] = s.action; });

  for (let n = data.start; n <= data.end; n++) {
    const el = document.createElement('div');
    el.className = 'num-cell';
    el.textContent = n;

    if (primeSet.has(n)) {
      el.classList.add('is-prime');
      el.title = `${n} is PRIME ✓`;
    } else if (stepMap[n] === 'continue') {
      el.classList.add('skipped');
      el.title = `${n} — skipped (continue)`;
    } else {
      el.title = `${n} — composite (break hit)`;
    }

    grid.appendChild(el);
    const delay = (n - data.start) * 8;
    setTimeout(() => el.classList.add('shown'), delay);
  }
}

function renderLog(data) {
  const log = document.getElementById('view-log');
  log.innerHTML = '';

  data.steps.forEach((step, i) => {
    const row = document.createElement('div');
    row.className = 'log-entry';

    const numColor = step.is_prime ? 'var(--green)' : step.action === 'continue' ? 'var(--yellow)' : 'var(--muted)';

    row.innerHTML = `
      <span class="log-num" style="color:${numColor}">${step.number}</span>
      <span class="log-action ${step.action}">${step.action.toUpperCase()}</span>
      <span class="log-reason">${step.reason}</span>
    `;
    log.appendChild(row);
    setTimeout(() => row.classList.add('shown'), i * 12);
  });
}
</script>
</body>
</html>
